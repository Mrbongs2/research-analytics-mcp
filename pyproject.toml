[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "research-analytics-mcp"
version = "0.1.0"
description = "MCP server + agent skills for literature review, Scopus journal targeting, medical evidence, market research, observation analytics and training (L&D) evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "literature-review", "openalex", "pubmed", "market-research", "biostatistics", "learning-and-development", "agent-skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
research-analytics-mcp = "research_analytics_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_analytics_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: calls live public APIs (deselect with -m 'not network')"]

[tool.ruff]
line-length = 130
target-version = "py310"
